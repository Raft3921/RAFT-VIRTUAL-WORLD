name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure room sync endpoint
        env:
          SYNC_ENDPOINT: ${{ vars.SYNC_ENDPOINT }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync('dist/sync-config.js', 'export const SYNC_ENDPOINT = ' + JSON.stringify(process.env.SYNC_ENDPOINT || '') + ';\\n')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4