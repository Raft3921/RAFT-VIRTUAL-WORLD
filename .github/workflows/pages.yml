name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp player update notification
        run: |
          python3 - <<'PYBUILD'
          import json, re
          from pathlib import Path
          build_id = '${{ github.sha }}'
          Path('dist/build-info.js').write_text('export const BUILD_ID='+json.dumps(build_id)+';\n')
          Path('dist/release.json').write_text(json.dumps({'buildId':build_id}))
          page = Path('dist/index.html')
          page.write_text(re.sub(r'name="vrs-build" content="[^"]*"', 'name="vrs-build" content="'+build_id+'"', page.read_text()))
          PYBUILD
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4