  <title>RAFT Multiverse Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2324d6ff' d='M2 9 16 2l14 7v14l-14 7-14-7z'/%3E%3Cpath fill='%23091c36' d='M10 12h12v10H10z'/%3E%3C/svg%3E" />
  <style>
    :root{--ink:#eaf7ff;--muted:#9eb5c9;--glass:rgba(8,22,45,.82);--line:rgba(121,202,255,.25);--cyan:#55d8ff;--pink:#fe78bc}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#061226;color:var(--ink);font:16px/1.35 system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));background:linear-gradient(#071a35eF,transparent)}h1{font-size:1rem;margin:0;letter-spacing:.1em}.badge{font-size:.72rem;color:#061226;background:var(--cyan);padding:3px 8px;border-radius:99px;font-weight:800}.spacer{flex:1}button,.select{border:1px solid var(--line);background:#112d52;color:var(--ink);border-radius:10px;min-height:42px;padding:0 12px;font:inherit;cursor:pointer}button.primary{background:var(--cyan);color:#061426;font-weight:800}.panel{position:fixed;z-index:3;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);border-radius:16px;box-shadow:0 18px 44px #0005}.members{top:74px;left:16px;width:250px;padding:12px}.members h2,.controls h2{font-size:.78rem;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}.member{display:flex;align-items:center;gap:9px;padding:7px;border-radius:10px}.member.active{background:#1a4865}.member img{image-rendering:pixelated;width:34px;height:34px;object-fit:cover;object-position:50% 0;background:#223}.member small{display:block;color:var(--muted)}.controls{right:16px;bottom:16px;width:286px;padding:14px}.controls label{font-size:.78rem;color:var(--muted);display:block;margin:9px 0 4px}.controls .row{display:flex;gap:8px}.controls .row>*{flex:1;min-width:0}.move{position:fixed;z-index:3;left:22px;bottom:22px;display:grid;grid-template:50px 50px 50px/50px 50px 50px;gap:4px}.move button{padding:0;background:#102e50cc;font-size:1.15rem}.move [data-move='forward']{grid-column:2}.move [data-move='left']{grid-row:2;grid-column:1}.move [data-move='back']{grid-row:2;grid-column:2}.move [data-move='right']{grid-row:2;grid-column:3}.hint{position:fixed;z-index:2;bottom:22px;left:200px;max-width:300px;color:var(--muted);font-size:.78rem}.toast{position:fixed;z-index:5;top:70px;left:50%;transform:translateX(-50%);background:#0a3150;border:1px solid var(--cyan);padding:9px 14px;border-radius:12px;display:none}.modal{position:fixed;inset:0;z-index:6;background:#020a16bb;display:none;place-items:center;padding:18px}.modal.show{display:grid}.modal .box{width:min(420px,100%);padding:20px}.modal h2{margin:0 0 8px}.modal p{color:var(--muted)}.modal input{width:100%;padding:12px;background:#071c34;color:white;border:1px solid var(--line);border-radius:9px;font:inherit}@media(max-width:700px){.members{width:calc(100% - 32px);top:63px;display:flex;overflow:auto;padding:7px}.members h2{display:none}.member{min-width:70px;display:block;text-align:center;padding:4px;font-size:.7rem}.member small{display:none}.member img{width:42px;height:42px}.controls{bottom:12px;right:12px;width:calc(100% - 24px);padding:10px}.controls label{margin:5px 0 2px}.move{left:15px;bottom:190px;transform:scale(.86);transform-origin:bottom left}.hint{display:none}.top{padding:10px}.top button{min-height:36px;padding:0 8px;font-size:.78rem}}
  @media(max-aspect-ratio:1/1){.members{width:calc(100% - 32px);top:63px;display:block;overflow:auto;padding:7px;white-space:nowrap}.members h2{display:none}.members #memberList{display:flex;gap:4px}.member{min-width:64px;display:block;text-align:center;padding:4px;font-size:.7rem}.member small{display:none}.member img{width:42px;height:42px}.controls{bottom:12px;right:12px;width:calc(100% - 24px);padding:10px}.controls label{margin:5px 0 2px}.move{left:15px;bottom:190px;transform:scale(.86);transform-origin:bottom left}.hint{display:none}.top{padding:10px}.top button{min-height:36px;padding:0 8px;font-size:.78rem}}

<body>
  <canvas id="scene"></canvas><div class="toast" id="toast"></div>
  <header class="top"><h1>RAFT <span>MULTIVERSE STUDIO</span></h1><span class="badge" id="count">7 / 8</span><span class="spacer"></span><button id="camera">撮影カメラ</button><button class="primary" id="room">ルーム</button></header>
  <aside class="panel members"><h2>MEMBERS · 最大8人</h2><div id="memberList"></div></aside>
  <section class="panel controls"><h2>PLAYER SETTINGS</h2><label>操作するメンバー</label><select class="select" id="playerSelect"></select><div class="row"><button id="skinBtn">スキンを変更</button><input id="skinInput" type="file" accept="image/png" hidden><button id="pose">ポーズ</button></div><label>ワールド</label><div class="row"><select class="select" id="world"><option value="stage">Neon Stage</option><option value="sunset">Sunset Room</option><option value="void">Void Studio</option></select><button id="reset">位置を戻す</button></div></section>
  <div class="move"><button data-move="forward">▲</button><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div><p class="hint">画面をドラッグして視点を回転。移動ボタンを長押しで操作できます。</p>
  <div class="modal" id="roomModal"><div class="panel box"><h2>撮影ルーム</h2><p>同じルームコードを使って、メンバー全員が同じスタジオに入るための入口です。</p><label>ルームコード</label><input id="roomCode" value="RAFT-2026" maxlength="24"><div class="row" style="margin-top:14px"><button id="copy">招待リンクをコピー</button><button class="primary" id="closeRoom">入室する</button></div><p style="font-size:.78rem">現在はこの公開版の3D操作・スキン保持まで実装済みです。異なる端末間の位置同期は、次の更新で専用のリアルタイム接続を有効化します。</p></div></div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}</script>
  <script type="module">
  import * as THREE from 'three';
  const SKINS=[['week','week.png'],['moron','moron.png'],['やんさん','やんさん.png'],['raft','raft.png'],['muto','muto.png'],['mai','maiのコピー.png'],['1000001207','1000001207.png']];
  const canvas=document.querySelector('#scene'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(55,1,.1,100);camera.position.set(8,5,9);const clock=new THREE.Clock();let yaw=-.55,pitch=-.24,follow=true,selected=0,pose=0;const members=[];
  scene.background=new THREE.Color('#061226');scene.fog=new THREE.Fog('#061226',13,31);scene.add(new THREE.HemisphereLight('#b9eeff','#102043',2));const key=new THREE.DirectionalLight('#ffffff',2.4);key.position.set(6,10,4);key.castShadow=true;scene.add(key);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:'#0b2846',roughness:.82,metalness:.35}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(50,50,'#55d8ff','#15385a');grid.position.y=.01;scene.add(grid);
  const rings=[];for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(2.2+i*2.4,.028,6,64),new THREE.MeshBasicMaterial({color:i===1?'#fe78bc':'#55d8ff'}));r.rotation.x=Math.PI/2;r.position.y=.03;scene.add(r);rings.push(r)}
  function crop(img,x,y,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(img,x,y,w,h,0,0,w,h);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.colorSpace=THREE.SRGBColorSpace;return t}
  function part(img,box,uv,scale=1){const mats=uv.map(a=>new THREE.MeshStandardMaterial({map:crop(img,...a),transparent:true,alphaTest:.05,roughness:.9}));const m=new THREE.Mesh(new THREE.BoxGeometry(...box.map(v=>v*scale)),mats);m.castShadow=true;return m}
  function avatar(name,file,i){const g=new THREE.Group();g.userData={name,file,walk:Math.random()*6};const img=new Image();img.onload=()=>{const s=1/8;/* px coordinates: right,left,top,bottom,front,back */
    const h=part(img,[8,8,8],[[16,8,8,8],[0,8,8,8],[8,0,8,8],[16,0,8,8],[8,8,8,8],[24,8,8,8]],s);h.position.y=3.5;g.add(h);
    const hat=part(img,[8.5,8.5,8.5],[[48,8,8,8],[32,8,8,8],[40,0,8,8],[48,0,8,8],[40,8,8,8],[56,8,8,8]],s);hat.position.copy(h.position);g.add(hat);
    const body=part(img,[8,12,4],[[28,20,4,12],[16,20,4,12],[20,16,8,4],[28,16,8,4],[20,20,8,12],[32,20,8,12]],s);body.position.y=2.25;g.add(body);
    const jacket=part(img,[8.25,12.25,4.25],[[28,36,4,12],[16,36,4,12],[20,32,8,4],[28,32,8,4],[20,36,8,12],[32,36,8,12]],s);jacket.position.copy(body.position);g.add(jacket);
    const rightLeg=[[8,20,4,12],[0,20,4,12],[4,16,4,4],[8,16,4,4],[4,20,4,12],[12,20,4,12]],leftLeg=[[24,52,4,12],[16,52,4,12],[20,48,4,4],[24,48,4,4],[20,52,4,12],[28,52,4,12]];const leg1=part(img,[4,12,4],rightLeg,s);leg1.position.set(-.25,.75,0);const leg2=part(img,[4,12,4],leftLeg,s);leg2.position.set(.25,.75,0);const lo1=part(img,[4.22,12.22,4.22],[[8,36,4,12],[0,36,4,12],[4,32,4,4],[8,32,4,4],[4,36,4,12],[12,36,4,12]],s);lo1.position.copy(leg1.position);const lo2=part(img,[4.22,12.22,4.22],[[8,52,4,12],[0,52,4,12],[4,48,4,4],[8,48,4,4],[4,52,4,12],[12,52,4,12]],s);lo2.position.copy(leg2.position);g.add(leg1,leg2,lo1,lo2);g.userData.legs=[leg1,leg2,lo1,lo2];
    const rightArm=[[44,20,3,12],[40,20,3,12],[43,16,3,4],[46,16,3,4],[43,20,3,12],[49,20,3,12]],leftArm=[[39,52,3,12],[32,52,3,12],[35,48,3,4],[39,48,3,4],[35,52,3,12],[43,52,3,12]];const a1=part(img,[3,12,4],rightArm,s);a1.position.set(-.69,2.25,0);const a2=part(img,[3,12,4],leftArm,s);a2.position.set(.69,2.25,0);const ao1=part(img,[3.22,12.22,4.22],[[44,36,3,12],[40,36,3,12],[43,32,3,4],[46,32,3,4],[43,36,3,12],[49,36,3,12]],s);ao1.position.copy(a1.position);const ao2=part(img,[3.22,12.22,4.22],[[60,52,3,12],[56,52,3,12],[59,48,3,4],[62,48,3,4],[59,52,3,12],[48,52,3,12]],s);ao2.position.copy(a2.position);g.add(a1,a2,ao1,ao2);g.userData.arms=[a1,a2,ao1,ao2];};
    g.position.set((i%4-1.5)*2.2,0,(Math.floor(i/4)-.5)*2.5);scene.add(g);members.push(g);if(file)img.src=file;return g}
  SKINS.forEach(([n,f],i)=>avatar(n,'skins/'+f,i));const savedSkin=localStorage.getItem('raftSkin');avatar('ゲスト',savedSkin||'',7);
  const list=document.querySelector('#memberList'),sel=document.querySelector('#playerSelect');function renderMembers(){list.innerHTML='';sel.innerHTML='';SKINS.concat([['ゲスト','']]).forEach(([n,f],i)=>{const d=document.createElement('button');d.className='member '+(i===selected?'active':'');d.innerHTML=`${f?`<img src="skins/${f}">`:'<img>'}<span>${n}<small>${i===selected?'操作中':'スタンバイ'}</small></span>`;d.onclick=()=>{selected=i;renderMembers()};list.append(d);sel.add(new Option(n,i,i===selected,i===selected))})}renderMembers();sel.onchange=e=>{selected=+e.target.value;renderMembers()};
  function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2000)}
  document.querySelector('#skinBtn').onclick=()=>document.querySelector('#skinInput').click();document.querySelector('#skinInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/png$/.test(f.type)){toast('PNGのJavaスキンを選択してください');return}const r=new FileReader();r.onload=()=>{localStorage.setItem('raftSkin',r.result);toast('スキンをこの端末に保存しました');setTimeout(()=>location.reload(),650)};r.readAsDataURL(f)};
  document.querySelector('#pose').onclick=()=>{pose=(pose+1)%3;toast(['ニュートラル','ピース','アクション'][pose])};document.querySelector('#reset').onclick=()=>{const p=members[selected];if(p)p.position.set((selected%4-1.5)*2.2,0,(Math.floor(selected/4)-.5)*2.5)};
  document.querySelector('#world').onchange=e=>{const p={stage:['#061226','#0b2846'],sunset:['#35142e','#6c2944'],void:['#03040a','#080b15']}[e.target.value];scene.background.set(p[0]);scene.fog.color.set(p[0]);floor.material.color.set(p[1])};document.querySelector('#camera').onclick=()=>{follow=!follow;toast(follow?'撮影カメラ：追従':'フリーカメラ')};
  const modal=document.querySelector('#roomModal');document.querySelector('#room').onclick=()=>modal.classList.add('show');document.querySelector('#closeRoom').onclick=()=>{localStorage.setItem('room',document.querySelector('#roomCode').value);modal.classList.remove('show');toast('ルームに入室しました')};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(location.href+'#room='+encodeURIComponent(document.querySelector('#roomCode').value));toast('招待リンクをコピーしました')};document.querySelector('#roomCode').value=localStorage.getItem('room')||'RAFT-2026';
  const moving={};document.querySelectorAll('[data-move]').forEach(b=>['pointerdown','pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>moving[b.dataset.move]=ev==='pointerdown')));let drag=false,lx=0,ly=0;canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-1.1,Math.min(.35,pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);
  function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),p=members[selected];if(p){const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),side=new THREE.Vector3(dir.z,0,-dir.x);if(moving.forward)p.position.addScaledVector(dir,-dt*3);if(moving.back)p.position.addScaledVector(dir,dt*3);if(moving.left)p.position.addScaledVector(side,-dt*3);if(moving.right)p.position.addScaledVector(side,dt*3);p.userData.walk+=dt*9;const swing=(moving.forward||moving.back||moving.left||moving.right)?Math.sin(p.userData.walk)*.55:0;p.userData.legs?.forEach((x,i)=>x.rotation.x=swing*(i?1:-1));p.userData.arms?.forEach((x,i)=>x.rotation.x=pose===1?(i?-.9:.9):pose===2?(i?-.5:1.4):-swing*(i?1:-1));if(follow){const target=p.position.clone().add(new THREE.Vector3(0,2.1,0)),off=new THREE.Vector3(Math.sin(yaw)*8,3.5,Math.cos(yaw)*8);off.applyAxisAngle(new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),pitch);camera.position.lerp(target.add(off),.08);camera.lookAt(p.position.x,1.8,p.position.z)}}rings.forEach((r,i)=>r.rotation.z+=dt*(.18+i*.08));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera)}loop();
  </script>
