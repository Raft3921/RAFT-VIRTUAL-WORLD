<body>
  <canvas id="scene"></canvas><div class="toast" id="toast"></div>
  <header class="top"><h1>RAFT <span>STUDIO</span></h1><span class="spacer"></span><button id="masterBtn">F1 MASTER</button></header>
  <aside class="panel members"><h2>MEMBERS · 最大8人</h2><div id="memberList"></div></aside>
  <section class="panel controls"><h2>PLAYER SETTINGS</h2><label>操作するメンバー</label><select class="select" id="playerSelect"></select><div class="row"><button id="skinBtn">スキンを変更</button><input id="skinInput" type="file" accept="image/png" hidden><button id="pose">ポーズ</button></div><label>ワールド</label><div class="row"><select class="select" id="world"><option value="stage">Neon Stage</option><option value="sunset">Sunset Room</option><option value="void">Void Studio</option></select><button id="reset">位置を戻す</button></div></section>

  <div class="modal" id="roomModal"><div class="panel box"><h2>撮影ルーム</h2><p>同じルームコードを使って、メンバー全員が同じスタジオに入るための入口です。</p><label>ルームコード</label><input id="roomCode" value="RAFT-2026" maxlength="24"><div class="row" style="margin-top:14px"><button id="copy">招待リンクをコピー</button><button class="primary" id="closeRoom">入室する</button></div><p style="font-size:.78rem">現在はこの公開版の3D操作・スキン保持まで実装済みです。異なる端末間の位置同期は、次の更新で専用のリアルタイム接続を有効化します。</p></div></div>

  <script type="module">
  import * as THREE from 'three';

  const canvas=document.querySelector('#scene'), renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(55,1,.1,100);camera.position.set(8,5,9);const clock=new THREE.Clock();let yaw=-.55,pitch=-.24,follow=true,selected=0,pose=0;const members=[];
  scene.background=new THREE.Color('#48bef4');scene.fog=new THREE.Fog('#48bef4',25,56);scene.add(new THREE.HemisphereLight('#d9f7ff','#478b2f',2.8));const key=new THREE.DirectionalLight('#fff9d4',3);key.position.set(10,18,8);key.castShadow=true;scene.add(key);

  const bladeGeo=new THREE.PlaneGeometry(.055,.52);bladeGeo.translate(0,.26,0);const bladeMat=new THREE.MeshLambertMaterial({color:'#367d28',side:THREE.DoubleSide});const grass=new THREE.InstancedMesh(bladeGeo,bladeMat,900),bladeData=[];const dummy=new THREE.Object3D();for(let i=0;i<900;i++){const a=i*2.399963,rad=2+Math.sqrt(i)*1.08,x=Math.cos(a)*rad,z=Math.sin(a)*rad;bladeData.push({x,z,a,phase:i*.37,scale:.65+(i%7)*.07});dummy.position.set(x,0,z);dummy.rotation.set(0,a,0);dummy.scale.setScalar(bladeData[i].scale);dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix)}grass.instanceMatrix.needsUpdate=true;scene.add(grass);
  const rings=[];
  function crop(img,x,y,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(img,x,y,w,h,0,0,w,h);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;t.colorSpace=THREE.SRGBColorSpace;return t}
  function part(img,box,uv,scale=1){const mats=uv.map(a=>new THREE.MeshStandardMaterial({map:crop(img,...a),transparent:true,alphaTest:.05,roughness:.9}));const m=new THREE.Mesh(new THREE.BoxGeometry(...box.map(v=>v*scale)),mats);m.castShadow=true;return m}
  function avatar(name,file,i){const g=new THREE.Group();g.userData={name,file,walk:Math.random()*6};const img=new Image();img.onload=()=>{const s=1/8;/* px coordinates: right,left,top,bottom,front,back */
    const h=part(img,[8,8,8],[[16,8,8,8],[0,8,8,8],[8,0,8,8],[16,0,8,8],[8,8,8,8],[24,8,8,8]],s);h.position.y=3.5;g.add(h);
    const hat=part(img,[8.5,8.5,8.5],[[48,8,8,8],[32,8,8,8],[40,0,8,8],[48,0,8,8],[40,8,8,8],[56,8,8,8]],s);hat.position.copy(h.position);g.add(hat);
    const body=part(img,[8,12,4],[[28,20,4,12],[16,20,4,12],[20,16,8,4],[28,16,8,4],[20,20,8,12],[32,20,8,12]],s);body.position.y=2.25;g.add(body);
    const jacket=part(img,[8.25,12.25,4.25],[[28,36,4,12],[16,36,4,12],[20,32,8,4],[28,32,8,4],[20,36,8,12],[32,36,8,12]],s);jacket.position.copy(body.position);g.add(jacket);
    const rightLeg=[[8,20,4,12],[0,20,4,12],[4,16,4,4],[8,16,4,4],[4,20,4,12],[12,20,4,12]],leftLeg=[[24,52,4,12],[16,52,4,12],[20,48,4,4],[24,48,4,4],[20,52,4,12],[28,52,4,12]];const leg1=part(img,[4,12,4],rightLeg,s);leg1.position.set(-.25,.75,0);const leg2=part(img,[4,12,4],leftLeg,s);leg2.position.set(.25,.75,0);const lo1=part(img,[4.22,12.22,4.22],[[8,36,4,12],[0,36,4,12],[4,32,4,4],[8,32,4,4],[4,36,4,12],[12,36,4,12]],s);lo1.position.copy(leg1.position);const lo2=part(img,[4.22,12.22,4.22],[[8,52,4,12],[0,52,4,12],[4,48,4,4],[8,48,4,4],[4,52,4,12],[12,52,4,12]],s);lo2.position.copy(leg2.position);g.add(leg1,leg2,lo1,lo2);g.userData.legs=[leg1,leg2,lo1,lo2];
    const rightArm=[[47,20,3,12],[40,20,3,12],[44,16,3,4],[47,16,3,4],[44,20,3,12],[51,20,3,12]],leftArm=[[39,52,3,12],[32,52,3,12],[36,48,3,4],[39,48,3,4],[36,52,3,12],[43,52,3,12]];const a1=part(img,[3,12,4],rightArm,s);a1.position.set(-.69,2.25,0);const a2=part(img,[3,12,4],leftArm,s);a2.position.set(.69,2.25,0);const ao1=part(img,[3.22,12.22,4.22],[[47,36,3,12],[40,36,3,12],[44,32,3,4],[47,32,3,4],[44,36,3,12],[51,36,3,12]],s);ao1.position.copy(a1.position);const ao2=part(img,[3.22,12.22,4.22],[[55,52,3,12],[48,52,3,12],[52,48,3,4],[55,48,3,4],[52,52,3,12],[59,52,3,12]],s);ao2.position.copy(a2.position);g.add(a1,a2,ao1,ao2);g.userData.arms=[a1,a2,ao1,ao2];};
    g.position.set((i%4-1.5)*2.2,0,(Math.floor(i/4)-.5)*2.5);scene.add(g);members.push(g);if(file)img.src=file;return g}
  SKINS.forEach(([n,f],i)=>avatar(n,'skins/'+f,i));const savedSkin=localStorage.getItem('raftSkin');avatar('ゲスト',savedSkin||'',7);
  const list=document.querySelector('#memberList'),sel=document.querySelector('#playerSelect');function renderMembers(){list.innerHTML='';sel.innerHTML='';SKINS.concat([['ゲスト','']]).forEach(([n,f],i)=>{const d=document.createElement('button');d.className='member '+(i===selected?'active':'');d.innerHTML=`${f?`<img src="skins/${f}">`:'<img>'}<span>${n}<small>${i===selected?'操作中':'スタンバイ'}</small></span>`;d.onclick=()=>{selected=i;renderMembers()};list.append(d);sel.add(new Option(n,i,i===selected,i===selected))})}renderMembers();sel.onchange=e=>{selected=+e.target.value;renderMembers()};
  function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2000)}
  document.querySelector('#skinBtn').onclick=()=>document.querySelector('#skinInput').click();document.querySelector('#skinInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/png$/.test(f.type)){toast('PNGのJavaスキンを選択してください');return}const r=new FileReader();r.onload=()=>{localStorage.setItem('raftSkin',r.result);toast('スキンをこの端末に保存しました');setTimeout(()=>location.reload(),650)};r.readAsDataURL(f)};
  document.querySelector('#pose').onclick=()=>{pose=(pose+1)%3;toast(['ニュートラル','ピース','アクション'][pose])};document.querySelector('#reset').onclick=()=>{const p=members[selected];if(p)p.position.set((selected%4-1.5)*2.2,0,(Math.floor(selected/4)-.5)*2.5)};
  const master=document.querySelector('#master'),masterPlayer=document.querySelector('#masterPlayer');SKINS.concat([['ゲスト','']]).forEach(([n],i)=>masterPlayer.add(new Option(n,i)));function toggleMaster(){master.classList.toggle('show')}document.querySelector('#masterBtn').onclick=toggleMaster;document.querySelector('#masterClose').onclick=toggleMaster;addEventListener('keydown',e=>{if(e.key==='F1'){e.preventDefault();toggleMaster()}});masterPlayer.onchange=e=>{selected=+e.target.value;sel.value=selected;renderMembers()};document.querySelector('#cameraMode').onchange=e=>{cameraMode=e.target.value;follow=cameraMode!=='free'};document.querySelector('#distance').oninput=e=>{cameraDistance=+e.target.value;document.querySelector('#distanceValue').textContent=cameraDistance};document.querySelector('#masterWorld').onchange=e=>{const p={stage:['#48bef4','#4f9b37'],sunset:['#ff9d69','#7a9b3b'],void:['#10244a','#274e42']}[e.target.value];scene.background.set(p[0]);scene.fog.color.set(p[0]);floor.material.color.set(p[1])};document.querySelector('#masterReset').onclick=()=>{resetAll();toast('全員の位置を戻しました')};
  const moving={forward:false,back:false,left:false,right:false};function stick(id,look){const el=document.querySelector(id),k=el.querySelector('.knob');let on=false;const set=e=>{const r=el.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.28))),y=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.28)));k.style.transform=`translate(${x*34}px,${y*34}px)`;if(look){yaw-=x*.055;pitch=Math.max(-1.05,Math.min(.28,pitch-y*.04))}else{moving.forward=y<-.18;moving.back=y>.18;moving.left=x<-.18;moving.right=x>.18}};el.onpointerdown=e=>{on=true;el.setPointerCapture(e.pointerId);set(e)};el.onpointermove=e=>on&&set(e);const end=()=>{on=false;k.style.transform='';if(!look)Object.keys(moving).forEach(x=>moving[x]=false)};el.onpointerup=end;el.onpointercancel=end}stick('#moveStick',false);stick('#lookStick',true);let drag=false,lx=0,ly=0;canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lx)*.008;pitch=Math.max(-1.1,Math.min(.35,pitch-(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});canvas.addEventListener('pointerup',()=>drag=false);
  let cameraDistance=7,cameraMode='follow';function resetAll(){members.forEach((p,i)=>p.position.set((i%4-1.5)*2.2,0,(Math.floor(i/4)-.5)*2.5))}function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),p=members[selected];if(p){const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),side=new THREE.Vector3(dir.z,0,-dir.x),active=Object.values(moving).some(Boolean);if(moving.forward)p.position.addScaledVector(dir,-dt*3.2);if(moving.back)p.position.addScaledVector(dir,dt*3.2);if(moving.left)p.position.addScaledVector(side,-dt*3.2);if(moving.right)p.position.addScaledVector(side,dt*3.2);p.userData.walk+=dt*(active?10:3);const swing=active?Math.sin(p.userData.walk)*.72:Math.sin(p.userData.walk)*.035;p.userData.legs?.forEach((x,i)=>x.rotation.x=swing*(i%2?1:-1));p.userData.arms?.forEach((x,i)=>x.rotation.x=pose===1?(i%2?-.9:.9):pose===2?(i%2?-.5:1.4):-swing*(i%2?1:-1));p.rotation.y=THREE.MathUtils.lerp(p.rotation.y,Math.atan2(dir.x,dir.z),.12);if(cameraMode!=='free'){const target=cameraMode==='wide'?new THREE.Vector3(0,1.5,0):p.position.clone().add(new THREE.Vector3(0,1.9,0)),d=cameraMode==='wide'?13:cameraDistance,off=new THREE.Vector3(Math.sin(yaw)*d,d*.42,Math.cos(yaw)*d);off.applyAxisAngle(new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),pitch);camera.position.lerp(target.add(off),.11);camera.lookAt(cameraMode==='wide'?0:p.position.x,cameraMode==='wide'?1.5:1.65,cameraMode==='wide'?0:p.position.z)}}for(let i=0;i<900;i++){const b=bladeData[i],wind=Math.sin(clock.elapsedTime*1.8+b.phase)*.2;dummy.position.set(b.x,0,b.z);dummy.rotation.set(0,b.a+wind,wind);dummy.scale.setScalar(b.scale);dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix)}grass.instanceMatrix.needsUpdate=true;renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.render(scene,camera)}loop();
